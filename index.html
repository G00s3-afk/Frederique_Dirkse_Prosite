
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prosite — Typography</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="flex-header">

      <img
        class="flex-header-logo"
        src="foto's prosite/logo.png"
        alt="Prosite logo"
    >

    <div class="header-right">

        <div class="flex-header-hamburger">
            <span>☰</span>
        </div>

        <img
            class="flex-header-seek"
            src="foto's prosite/seek.png"
            alt="Zoeken"
        >

        <div class="flex-header-login">
            Log In
        </div>

    </div>

    </header>


    <!-- SLIDER -->
    <section class="hero">

        <img
            class="slider"
            src="foto's prosite/slider1.png"
            alt="Typografische presentatie"
        >

    </section>


    <!-- FONT GRID -->
    <main class="main">

        <section class="grid" aria-label="Fontcategorieën">

    <!-- 1. SANS SERIF -->
    <div class="grid-item-1">
        <p class="top">Sans Serif</p>
        <img
            src="foto's prosite/grid1.png"
            alt="Sans serif lettertypen"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 2. SERIF -->
    <div class="grid-item-2">
        <p class="top">Serif</p>
        <img
            src="foto's prosite/grid2.png"
            alt="Kleurenwiel"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 3. DISPLAY -->
    <div class="grid-item-3">
        <p class="top">Display</p>
        <img
            src="foto's prosite/grid4.png"
            alt="Typografische vormen"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 4. TEXT -->
    <div class="grid-item-4">
        <p class="top">Text</p>
        <img
            src="foto's prosite/grid6.png"
            alt="Outlineletters"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 5. VARIABLE FONTS -->
    <div class="grid-item-5">
        <p class="top">Variable Fonts</p>
        <img
            src="foto's prosite/grid3.png"
            alt="Variabele lettertypen in een raster"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 6. GLOBAL FONTS -->
    <div class="grid-item-6">
        <p class="top">Global Fonts</p>
        <img
            src="foto's prosite/grid5.png"
            alt="Typografie in verschillende stijlen"
        >
        <p class="bottom">Browse fonts</p>
    </div>

    <!-- 7. NEW FONTS -->
    <div class="grid-item-7">
        <p class="top">New Fonts</p>
        <img
            src="foto's prosite/grid7.png"
            alt="Nieuwe lettertypen"
        >
        <p class="bottom">Browse fonts</p>
    </div>

</section>

    </main>

</body>
</html>
